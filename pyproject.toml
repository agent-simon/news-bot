[project]
name = "news-bot"
version = "0.1.0"
description = "Telegram bot that aggregates Playwright/AI-testing news and posts AI-written summaries."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot",
    "feedparser",
    "openai",
    "apscheduler",
    "python-dotenv",
]

[project.scripts]
# Console entrypoint installed into .venv/bin by `uv sync`. The systemd unit and
# `uv run news-bot` both invoke this; the root bot.py shim also routes here.
news-bot = "newsbot.bot:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package lives under src/ with a name (newsbot) that differs from the project
# name (news-bot), so point hatchling at it explicitly. sources.json travels
# inside the package and is read module-relative at runtime.
packages = ["src/newsbot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle errors (E), Pyflakes (F), isort (I), pyupgrade (UP), flake8-bugbear (B).
select = ["E", "F", "I", "UP", "B"]
# E501 (line too long) off: several prompt strings and item dicts run long by design.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ (it's also installed editable by uv sync, but this
# keeps the tests runnable without the install step too).
pythonpath = ["src"]
